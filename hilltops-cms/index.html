<!doctype html><html lang="en"><head><base href="/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5ed69"><meta name="description" content="The Hilltop's Voice — Conalum National High School online publication"><link rel="manifest" href="manifest.webmanifest"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><title>The Hilltop's Voice | Conalum NHS</title><style>
:root{--ink:#19251d;--muted:#667064;--yellow:#f5ed69;--soft:#fffde9;--line:#e9e9dd;--white:#fff;--green:#243b2b}*{box-sizing:border-box}body{margin:0;background:#fafaf5;color:var(--ink);font:15px/1.65 Poppins,Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.container{width:min(1140px,calc(100% - 36px));margin:auto}.topline{background:var(--yellow);height:7px}.header{background:white;border-bottom:1px solid var(--line)}.header-inner{display:flex;align-items:center;gap:18px;padding:15px 0}.logo{width:77px;height:77px;object-fit:contain;border-radius:50%}.brand{flex:1}.brand h1{font-size:clamp(20px,3vw,30px);line-height:1.12;margin:0;font-weight:800}.brand p{margin:3px 0 0;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}.admin-link,.btn{border:0;border-radius:12px;padding:11px 18px;background:var(--yellow);color:#1a2418;font-weight:700}.admin-link{background:#f5f5ec}.nav{background:var(--green);color:white}.nav-inner{display:flex;gap:7px;align-items:center;overflow:auto}.nav button{background:transparent;color:white;border:0;padding:14px 17px;font-weight:600;white-space:nowrap;border-radius:0}.nav button.active,.nav button:hover{background:var(--yellow);color:var(--ink)}.hero{margin:28px auto 35px;border-radius:22px;overflow:hidden;position:relative;min-height:370px;display:flex;align-items:end;background:linear-gradient(90deg,rgba(12,29,17,.94),rgba(12,29,17,.48),rgba(12,29,17,.12)),url('https://raw.githubusercontent.com/303364-pixel/ConalumNHS/main/gate.jpg') center/cover}.hero-content{padding:38px;color:white;max-width:650px}.eyebrow{display:inline-block;background:var(--yellow);color:var(--ink);font-size:11px;font-weight:800;letter-spacing:.7px;padding:5px 12px;border-radius:7px;text-transform:uppercase}.hero h2{font-size:clamp(28px,5vw,48px);line-height:1.14;margin:16px 0 12px}.hero p{max-width:510px}.hero .btn{margin-top:12px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:0 0 18px}.section-head h2{font-size:27px;margin:0}.section-head p{margin:0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-bottom:55px}.card{background:white;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 5px 18px #1a241808}.card img{width:100%;height:190px;object-fit:cover;display:block}.card-body{padding:20px}.tag{display:inline-block;background:var(--yellow);border-radius:7px;font-size:10px;font-weight:800;text-transform:uppercase;padding:4px 9px}.card h3{font-size:19px;line-height:1.35;margin:10px 0}.card p{color:var(--muted);font-size:13px}.meta{font-size:12px;color:var(--muted)}.read{border:0;background:none;padding:8px 0;color:#315a35;font-weight:800}.article{max-width:850px;margin:36px auto 70px;background:white;border-radius:20px;padding:clamp(22px,5vw,52px);border:1px solid var(--line)}.article h2{font-size:clamp(28px,4vw,43px);line-height:1.2;margin:16px 0}.article figure{margin:25px 0}.article figure img{width:100%;border-radius:15px;max-height:490px;object-fit:cover}.article figcaption{font-size:12px;color:var(--muted);padding:7px 0}.article .story{white-space:pre-wrap;line-height:1.95}.back{background:none;border:0;padding:0;color:#3b6043;font-weight:700}.footer{background:var(--green);color:white;padding:34px 0}.footer-inner{display:flex;gap:22px;align-items:center}.footer img{width:70px;border-radius:50%}.footer p{font-size:12px;opacity:.8;margin:4px 0}.empty{grid-column:1/-1;padding:45px;text-align:center;background:white;border-radius:18px;color:var(--muted)}.admin{background:white;border:1px solid var(--line);border-radius:18px;padding:25px;margin:30px auto 60px}.admin h2{margin:0 0 8px}.admin p{color:var(--muted)}.fields{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:flex;flex-direction:column;gap:5px;margin:9px 0}.field.wide{grid-column:1/-1}label{font-size:12px;font-weight:700}input,select,textarea{border:1px solid #d9dfd2;border-radius:10px;padding:12px;background:white;width:100%;color:var(--ink)}textarea{min-height:135px;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.secondary{background:#eaece4}.danger{background:#ffe0dc;color:#7d241c}.admin-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.admin-item span{flex:1}.admin-item button{padding:7px 12px;border:0;border-radius:8px}.notice{background:var(--soft);padding:12px 16px;border-radius:10px;font-size:12px}.hidden{display:none!important}@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.header-inner{gap:10px}.logo{width:60px;height:60px}.admin-link{padding:9px}.hero{min-height:330px}.hero-content{padding:24px}.fields{grid-template-columns:1fr}}@media(max-width:530px){.grid{grid-template-columns:1fr}.card img{height:210px}.brand p{font-size:9px}.brand h1{font-size:19px}.header-inner{padding:10px 0}.hero{margin-top:17px}.section-head h2{font-size:22px}.footer-inner{align-items:start}}
</style></head><body><div class="topline"></div><header class="header"><div class="container header-inner"><img class="logo" src="https://raw.githubusercontent.com/303364-pixel/ConalumNHS/main/logo.png" alt="The Hilltop's Voice publication logo"><div class="brand"><h1>The Hilltop's Voice</h1><p>Conalum National High School · The Cradle of Thriving Dreamers</p></div><button class="admin-link" onclick="go('admin')" aria-label="Open content manager">Manage</button></div></header><nav class="nav" aria-label="Main navigation"><div class="container nav-inner" id="navigation"></div></nav><main class="container" id="app" aria-live="polite"></main><footer class="footer"><div class="container footer-inner"><img src="https://raw.githubusercontent.com/303364-pixel/ConalumNHS/main/logo.png" alt="Publication emblem"><div><strong>The Hilltop's Voice</strong><p>The official student publication of Conalum National High School, Inopacan, Leyte.</p><p>Official publication · Content managed by school editors.</p></div></div></footer><script>
const KEY='hilltops-voice-cms-v2';const CMS_PIN='1119';const samples=[];const CATEGORIES=[['opinion','Opinion'],['cartoon','Editorial Cartooning'],['news','News'],['feature','Feature Stories'],['science','Science & Technology'],['sports','Sports News']];let cmsUnlocked=false;
let posts=load(),page='home',editing=null;function load(){try{let x=JSON.parse(localStorage.getItem(KEY));return Array.isArray(x)?x:samples}catch{return samples}}function save(){try{localStorage.setItem(KEY,JSON.stringify(posts));return true}catch{alert('Browser storage is full. Try a smaller image or export a backup.');return false}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function typeName(t){return CATEGORIES.find(c=>c[0]===t)?.[1]||'Publication'}function niceDate(s){return new Date((s||'2026-10-27')+'T12:00:00').toLocaleDateString('en-PH',{year:'numeric',month:'long',day:'numeric'})}function imageMarkup(p){return p.image?`<img src="${esc(p.image)}" alt="${esc(p.caption||p.title)}">`:`<div style="height:190px;background:#fffbd6;display:grid;place-items:center;text-align:center;padding:20px;color:#666">Original cartoon image placeholder</div>`}function nav(){document.getElementById('navigation').innerHTML=[['home','Home'],...CATEGORIES].map(([id,name])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${name}</button>`).join('')}function card(p){return `<article class="card">${imageMarkup(p)}<div class="card-body"><span class="tag">${typeName(p.type)}</span><h3>${esc(p.title)}</h3><div class="meta">By ${esc(p.author)} · ${niceDate(p.date)}</div><p>${esc(p.summary)}</p><button class="read" onclick="go('article','${p.id}')">Read story →</button></div></article>`}function go(p,id){page=p;nav();let app=document.getElementById('app');if(p==='home'){let featured=posts.find(x=>x.type==='feature');app.innerHTML=`<section class="hero"><div class="hero-content"><span class="eyebrow">The official school publication</span><h2>Stories. Ideas. Voices.<br>A Greater Conalum.</h2><p>With dreams full-blown, we begin at Conalum. Discover student perspectives, inspiring features, and meaningful editorial cartoons.</p><button class="btn" onclick="go('feature')">Explore stories →</button></div></section><div class="section-head"><div><h2>Latest from the Hilltop</h2><p>Student voices and school community stories</p></div></div><div class="grid">${posts.length?posts.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(card).join(''):'<div class="empty">No published content yet.</div>'}</div>`}else if(CATEGORIES.some(c=>c[0]===p)){let selected=posts.filter(x=>x.type===p);app.innerHTML=`<div class="section-head" style="margin-top:36px"><div><h2>${typeName(p)}</h2><p>${p==='cartoon'?'Thought-provoking art and visual commentary.':'Campus journalism and student perspectives.'}</p></div></div><div class="grid">${selected.length?selected.map(card).join(''):'<div class="empty">No content in this section yet.</div>'}</div>`}else if(p==='article'){let x=posts.find(x=>x.id===id);if(!x){go('home');return}app.innerHTML=`<article class="article"><button class="back" onclick="go('${x.type}')">← Back to ${typeName(x.type)}</button><div style="margin-top:24px"><span class="tag">${typeName(x.type)}</span></div><h2>${esc(x.title)}</h2><p class="meta">By ${esc(x.author)} · Published ${niceDate(x.date)}</p><figure>${imageMarkup(x)}<figcaption>${esc(x.caption)}</figcaption></figure><div class="story">${esc(x.body)}</div></article>`}else if(p==='admin'){adminView()}window.scrollTo({top:0,behavior:'instant'})}function adminView(){if(!cmsUnlocked){document.getElementById('app').innerHTML=`<section class="admin" style="max-width:500px"><h2>CMS Administrator Access</h2><p>Enter your administrator PIN.</p><form onsubmit="unlockCMS(event)"><label for="cmsPin">PIN</label><input id="cmsPin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" required><div class="actions"><button class="btn" type="submit">Unlock CMS</button></div><p id="pinError" style="color:#a33" class="hidden">Incorrect PIN.</p><p class="notice">Prototype only: client-side PIN and browser-local storage do not provide secure public publishing.</p></form></section>`;return}document.getElementById('app').innerHTML=`<section class="admin"><h2>Content Manager</h2><p>Add, update, and remove content in all six publication sections. <button class="btn secondary" onclick="cmsUnlocked=false;go('home')">Lock CMS</button></p><div class="notice"><strong>Demo CMS:</strong> Changes are saved only in this browser. No account authentication or shared server is included. Export a backup before clearing browser data. For public multi-editor use, connect a secure hosted CMS.</div><form id="editor" onsubmit="submitPost(event)"><h3 id="form-title">Add a publication item</h3><div class="fields"><div class="field"><label for="kind">Category</label><select id="kind">${CATEGORIES.map(([id,name])=>`<option value="${id}">${name}</option>`).join("")}</select></div><div class="field"><label for="date">Publication date</label><input type="date" id="date" required></div><div class="field wide"><label for="headline">Title</label><input id="headline" required maxlength="160"></div><div class="field"><label for="author">Author</label><input id="author" required maxlength="100"></div><div class="field"><label for="photo">Upload image (optional)</label><input type="file" id="photo" accept="image/*"><small>Images are saved in this browser; use smaller images for best results.</small></div><div class="field wide"><label for="summary">Short preview</label><textarea id="summary" required style="min-height:75px"></textarea></div><div class="field wide"><label for="body">Full story / cartoon explanation</label><textarea id="body" required></textarea></div><div class="field wide"><label for="caption">Photo caption / illustration credit</label><input id="caption"></div></div><div class="actions"><button class="btn" type="submit">Save item</button><button type="button" class="btn secondary" onclick="resetEditor()">Clear editor</button></div></form><h3>Published items (${posts.length})</h3><div id="items">${posts.map(x=>`<div class="admin-item"><span><strong>${esc(x.title)}</strong><br><small>${typeName(x.type)} · ${niceDate(x.date)}</small></span><button class="secondary" onclick="editPost('${x.id}')">Edit</button><button class="danger" onclick="deletePost('${x.id}')">Delete</button></div>`).join('')||'<p>No items yet.</p>'}</div><div class="actions"><button class="btn secondary" onclick="exportData()">Export JSON backup</button><label class="btn secondary" for="importfile" style="cursor:pointer">Import JSON backup</label><input type="file" id="importfile" accept="application/json" class="hidden" onchange="importData(event)"></div></section>`;if(editing){let x=posts.find(x=>x.id===editing);if(x){for(let [field,key] of Object.entries({kind:'type',headline:'title',author:'author',date:'date',summary:'summary',body:'body',caption:'caption'}))document.getElementById(field).value=x[key]||'';document.getElementById('form-title').textContent='Edit publication item'}}else document.getElementById('date').value=new Date().toISOString().slice(0,10)}function unlockCMS(e){e.preventDefault();if(document.getElementById('cmsPin').value===CMS_PIN){cmsUnlocked=true;go('admin')}else document.getElementById('pinError').classList.remove('hidden')}function editPost(id){editing=id;go('admin');document.getElementById('editor').scrollIntoView({behavior:'smooth'})}function resetEditor(){editing=null;go('admin')}async function submitPost(e){e.preventDefault();let file=document.getElementById('photo').files[0];let prior=posts.find(x=>x.id===editing);let img=prior?.image||'';if(file){if(file.size>2*1024*1024){alert('Choose an image smaller than 2 MB.');return}img=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}let p={id:editing||'p'+Date.now(),type:document.getElementById('kind').value,title:document.getElementById('headline').value.trim(),author:document.getElementById('author').value.trim(),date:document.getElementById('date').value,summary:document.getElementById('summary').value.trim(),body:document.getElementById('body').value.trim(),caption:document.getElementById('caption').value.trim(),image:img};if(editing)posts=posts.map(x=>x.id===editing?p:x);else posts.unshift(p);if(save()){editing=null;go('admin')}}function deletePost(id){if(confirm('Delete this publication item?')){posts=posts.filter(x=>x.id!==id);save();editing=null;go('admin')}}function exportData(){let blob=new Blob([JSON.stringify(posts,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hilltops-voice-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importData(e){let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x)||!x.every(p=>p.id&&CATEGORIES.some(c=>c[0]===p.type)&&typeof p.title==='string'&&typeof p.body==='string'))throw Error('Invalid backup');if(confirm('Replace current content with imported items?')){posts=x;save();editing=null;go('admin')}}catch{alert('This is not a valid publication backup file.')}}go('home');if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});

// Appearance settings are stored in this browser, not shared across visitors.
const APPEARANCE_KEY='hilltops-appearance-v1';
function appearanceRead(){try{return JSON.parse(localStorage.getItem(APPEARANCE_KEY))||{}}catch{return {}}}
function appearanceApply(){const a=appearanceRead();if(a.logo){document.querySelectorAll('img.logo,footer img').forEach(img=>{img.src=a.logo;img.alt='The Hilltop\'s Voice official publication logo'})}const hero=document.querySelector('.hero');if(hero&&a.banner)hero.style.backgroundImage="linear-gradient(90deg,rgba(12,29,17,.94),rgba(12,29,17,.48),rgba(12,29,17,.12)),url("+JSON.stringify(a.banner)+")";if(hero&&a.tagline){const h=hero.querySelector('h2');if(h)h.textContent=a.tagline}if(hero&&a.description){const p=hero.querySelector('p');if(p)p.textContent=a.description}if(hero&&a.photo){let img=hero.querySelector('.appearance-photo');if(!img){img=document.createElement('img');img.className='appearance-photo';img.style.cssText='width:130px;height:130px;object-fit:cover;border-radius:14px;float:right;margin:0 0 15px 15px';hero.querySelector('.hero-content').prepend(img)}img.src=a.photo}}
function appearanceFile(input,target){const file=input.files&&input.files[0];if(!file)return;if(file.size>1500000){alert('Choose an image smaller than 1.5 MB.');return}const reader=new FileReader();reader.onload=()=>{document.getElementById(target).value=reader.result};reader.readAsDataURL(file)}
function appearanceEditor(){if(!cmsUnlocked)return;const app=document.getElementById('app');if(!app||document.getElementById('appearance-editor'))return;const a=appearanceRead();const section=document.createElement('section');section.id='appearance-editor';section.style.cssText='padding:22px;background:#fff;border:1px solid #e9e9dd;border-radius:18px;margin:20px auto;max-width:1000px';section.innerHTML='<h2>Website Appearance — Logo, Banner, Tagline & Photo</h2><p>These edits are saved in this browser only.</p><label>Publication logo URL or upload</label><input id="appearance-logo" style="width:100%" placeholder="Official publication logo URL"><input type="file" accept="image/*" onchange="appearanceFile(this,\'appearance-logo\')"><p><label>Trailblazer masthead banner — image URL or upload</label><input id="appearance-banner" style="width:100%" placeholder="Trailblazer banner image URL"><input type="file" accept="image/*" onchange="appearanceFile(this,\'appearance-banner\')"><small>Upload your Trailblazer banner here. You can replace it anytime.</small><p><label>Homepage tagline</label><input id="appearance-tagline" style="width:100%"></p><p><label>Introduction</label><textarea id="appearance-description" style="width:100%"></textarea></p><p><label>Featured photo URL or upload</label><input id="appearance-photo" style="width:100%" placeholder="Photo URL"><input type="file" accept="image/*" onchange="appearanceFile(this,\'appearance-photo\')"></p><button class="btn" onclick="appearanceSave()">Save Appearance</button>';app.prepend(section);for(const k of ['logo','banner','tagline','description','photo'])document.getElementById('appearance-'+k).value=a[k]||''}
function appearanceSave(){const a={};for(const k of ['logo','banner','tagline','description','photo'])a[k]=document.getElementById('appearance-'+k).value.trim();try{localStorage.setItem(APPEARANCE_KEY,JSON.stringify(a));alert('Appearance saved in this browser.');go('home')}catch{alert('Browser storage is full. Use smaller images.')}}
const originalGo=go;go=function(...args){originalGo(...args);if(args[0]==='admin')appearanceEditor();if(args[0]==='home')appearanceApply()};appearanceApply();
</script></body></html>
